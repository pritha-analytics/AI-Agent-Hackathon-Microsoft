server.port=8080
spring.application.name=cs-service

# Base URL of the Python AI-assistant app, used to relay a CS agent's chat
# replies back into the customer's chat window.
python.app.base-url=http://localhost:8000

# This is a frequently-redeployed demo app (static/index.html, app.js,
# style.css change often between runs) - without this, browsers cache those
# files aggressively and silently keep running old JS/CSS after a restart,
# which looks exactly like a broken feature (e.g. stale RBAC logic) when the
# server is actually already fixed. Force revalidation on every load.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=false

# Case and chat hand-off data used to live only in this process's memory
# (a ConcurrentHashMap) and was lost on every restart. It's now stored via
# Spring Data JPA, in the SAME physical Postgres instance the Python
# backend's Next Best Action / interaction-history data lives in - see
# backend/db.py and the root .env's DATABASE_URL. Separate tables
# (cs_case, cs_chat_request, ...), same database, so a case's customer_id
# can be joined against customer_interactions.customer_id.
#
# Spring Boot binds these from the process environment automatically -
# point them at that same Postgres instance, in JDBC form. If DATABASE_URL
# uses Supabase's pooler (host contains "pooler.supabase.com", port 6543),
# keep prepareThreshold=0 in the URL (see the Hikari/Hibernate settings
# below for why) - e.g.:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<pooler-host>:6543/postgres?prepareThreshold=0&sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
#   SPRING_DATASOURCE_PASSWORD=<password>
# (the Python app's DATABASE_URL points at the same host/db using
# SQLAlchemy's postgresql:// form - same database, different URL syntax.)
# Unlike the Python app, this one does NOT read the .env file - export
# these as real environment variables before starting the jar.
#
# Left unset, this falls back to a local file-based H2 database
# (./data/cs-service.mv.db next to wherever the jar runs from), so the app
# still runs standalone with zero setup, the same role SQLite plays for
# the Python backend.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cs-service;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# update, not validate: this is a demo app with no migration tool
# (Flyway/Liquibase) yet - the same "demo scope" tradeoff as elsewhere in
# this codebase (audit.py's hash chain isn't WORM storage either).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Supabase's connection string (the one DATABASE_URL points at, port 6543)
# is PgBouncer in transaction-pooling mode: the physical connection gets
# handed to a different logical session between statements, so a JDBC
# server-side prepared statement from one session can vanish before the
# next one tries to reuse it ("prepared statement ... does not exist").
# prepareThreshold=0 in the JDBC URL (see the comment above) turns that
# optimization off entirely - the one-time dialect-detection query at boot
# is unaffected, so no need to hardcode a dialect here (this file also
# has to work against the local H2 fallback).

# The pooler caps concurrent connections per project across every app
# using it (Python's SQLAlchemy pool included) - keep this small so
# cs-service can't starve the Python backend of pooler slots.
spring.datasource.hikari.maximum-pool-size=5
