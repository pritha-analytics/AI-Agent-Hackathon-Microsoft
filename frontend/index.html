<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Transition Navigator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="home-btn" role="button" tabindex="0" title="Start a new chat">
      <span class="avatar avatar-ai">S</span>
      <div class="brand-text">
        <span class="brand-name">Sara</span>
        <span class="brand-sub">Digital assistant · LF Bergslagen</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-toggle" id="lang-toggle">
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="sv" type="button">SV</button>
      </div>
      <button id="human-btn" class="human-btn" type="button">Talk to a person</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-toolbar">
        <button id="new-chat-btn" class="new-chat-btn" type="button">+ New chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <section id="plan-panel" class="plan-panel" aria-live="polite"></section>
    </aside>

    <main class="chat-shell">
      <div id="messages" class="messages">
        <div class="msg assistant">
          <span class="msg-label" id="greeting-label">Sara · AI assistant</span>
          <p id="greeting-text">Hej! I'm Sara, LF Bergslagen's digital assistant. Tell me what's changing in your life, and I'll help you think it through.</p>
        </div>
      </div>

      <div id="chips" class="chips"></div>

      <div id="attachment-preview" class="attachment-preview" hidden></div>

      <form id="chat-form" class="composer">
        <input id="file-input" type="file" accept=".pdf,.txt,.doc,.docx,.xls,.xlsx,image/*" multiple hidden />
        <button id="attach-btn" class="icon-btn" type="button" title="Attach a document">📎</button>
        <button id="mic-btn" class="icon-btn" type="button" title="Speak instead of typing" hidden>🎤</button>
        <textarea id="chat-input" rows="1" placeholder="Tell me what's happening in your life..." autocomplete="off"></textarea>
        <button id="send-btn" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
